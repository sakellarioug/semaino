[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semaino"
version = "1.0.0"
description = "Private Named Entity Recognition and Syntax Analysis for Greek documents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "flask>=3.0",
    "spacy>=3.7,<4",
    "spacy-transformers>=1.3",
    "torch>=2.0",
    "transformers>=4.40",
    "gr-nlp-toolkit>=0.2",
    "werkzeug>=3.0"
]


[project.scripts]
semaino = "semaino.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["semaino*"]

[tool.setuptools.package-data]
semaino = ["templates/*", "static/vendor/*"]
